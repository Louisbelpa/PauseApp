name: PauseApp
options:
  bundleIdPrefix: fr.louisbelpa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: none
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: fr.louisbelpa.pauseapp
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  PauseApp:
    type: application
    platform: iOS
    sources:
      - path: PauseApp
    info:
      path: PauseApp/Info.plist
      properties:
        CFBundleDisplayName: PauseApp
        CFBundleName: PauseApp
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - pauseapp
            CFBundleURLName: fr.louisbelpa.pauseapp
        LSApplicationQueriesSchemes:
          - instagram
          - snssdk1233
          - twitter
          - youtube
          - linkedin
          - reddit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        INFOPLIST_FILE: PauseApp/Info.plist
